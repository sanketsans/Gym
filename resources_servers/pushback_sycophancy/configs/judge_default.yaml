# Judge endpoint for pushback_sycophancy.
#
# Use a strong instruction follower from a different model family than the
# policy, to limit self-preference bias. The judge already gets the ground truth,
# so a non-reasoning or low-effort mode is enough; bounded latency matters more
# than peak accuracy.
#
# Override JUDGE_BASE_URL / JUDGE_MODEL / JUDGE_API_KEY to point at any
# OpenAI-compatible endpoint (hosted API or a local vLLM server).
judge_model:
  responses_api_models:
    openai_model:
      entrypoint: app.py
      openai_base_url: ${oc.env:JUDGE_BASE_URL,https://integrate.api.nvidia.com/v1}
      openai_api_key: ${oc.env:JUDGE_API_KEY,null}
      openai_model: ${oc.env:JUDGE_MODEL,nvidia/nemotron-3-ultra-550b-a55b}
